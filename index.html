<!DOCTYPE html>
<!-- 手機優先版：單屏免捲動、加大觸控按鈕、手勢操作、暫停及結算浮層 -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f5f0e8">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>砌屋仔</title>
<style>
  :root{
    --bg:#f5f0e8;
    --ink:#222;
    --blue:#2e86de;
    --blue-dark:#1b5fa8;
    --purple:#8e44ad;
    --purple-dark:#6c3483;
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
  }

  *,*::before,*::after{ box-sizing:border-box; }

  html{ height:100%; -webkit-text-size-adjust:100%; }

  body{
    margin:0;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:var(--bg);
    color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,-apple-system,sans-serif;
    display:flex;
    justify-content:center;
    padding:var(--sat) var(--sar) var(--sab) var(--sal);
    overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;
    touch-action:pan-x pan-y;
  }

  #app{
    width:100%;
    max-width:520px;
    min-height:0;
    display:flex;
    flex-direction:column;
    padding:2px 10px 0;
    touch-action:manipulation;
  }

  /* ---------- 頂部：地段資料 ---------- */
  #top{
    flex:0 0 auto;
    display:grid;
    grid-template-columns:auto minmax(0,1fr);
    column-gap:8px;
    align-items:start;
    padding:2px 0 3px;
  }
  #brand{
    grid-column:1;
    grid-row:1;
    font-size:14px;
    font-weight:700;
    letter-spacing:.5px;
    color:#3a3a3a;
    line-height:1.3;
    white-space:nowrap;
  }
  #district{ grid-column:2; grid-row:1; min-width:0; line-height:1.25; }
  .d-name{
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .d-meta{
    font-size:10.5px;
    color:#6f6a61;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:1px;
  }

  /* ---------- Hold / 下一個 ---------- */
  #hud{
    position:relative;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:10px;
    padding:5px 0 6px;
    margin-top:2px;
    border-top:1px solid rgba(0,0,0,.07);
  }
  .slot{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:2px;
    min-width:0;
  }
  .slot canvas{
    display:block;
    width:58px;
    height:42px;
    background:#fafafa;
    border:1px dashed #c3bbb0;
    border-radius:8px;
  }
  .slot-label{
    font-size:11.5px;
    line-height:1.15;
    color:#5c564d;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:110px;
  }
  #pause-btn{
    margin-left:auto;
    flex:0 0 auto;
    width:42px;
    height:42px;
    border-radius:12px;
    border:1px solid #ddd5c8;
    background:#fff;
    color:#4a4a4a;
    font-size:17px;
    line-height:1;
    font-family:inherit;
    cursor:pointer;
    touch-action:manipulation;
    box-shadow:0 2px 0 rgba(0,0,0,.06);
  }
  #pause-btn:active{ background:#f0ebe1; transform:translateY(1px); }

  /* ---------- 遊戲棋盤 ---------- */
  #stage{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  canvas#game{
    display:block;
    background:#fff;
    border-radius:10px;
    box-shadow:0 0 0 2px #333, 0 10px 24px rgba(0,0,0,.16);
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
  }

  /* ---------- 提示 ---------- */
  #hint{
    flex:0 0 auto;
    font-size:11.5px;
    line-height:1.45;
    color:#6b655c;
    text-align:center;
    padding:6px 2px 4px;
  }
  #hint .warn{ color:#c0392b; font-weight:600; display:block; margin-top:5px; }
  .touch-only{ display:inline; }
  .desktop-only{ display:none; }
  @media (hover:hover) and (pointer:fine){
    .touch-only{ display:none; }
    .desktop-only{ display:inline; }
  }
  /* 鍵盤指引：只喺有滑鼠／鍵盤嘅裝置顯示 */
  .key-guide{ display:none; }
  .kg{ display:flex; align-items:center; gap:7px; white-space:nowrap; }
  kbd{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:1.9em;
    height:1.9em;
    padding:0 .45em;
    border:1px solid #d3cab9;
    border-bottom-width:3px;
    border-radius:7px;
    background:#fffdf8;
    color:#4a4437;
    font-family:inherit;
    font-size:.92em;
    font-weight:700;
    line-height:1;
  }

  /* ---------- 操作按鈕 ---------- */
  #controls{
    flex:0 0 auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
    padding:4px 0 6px;
  }
  #controls button{
    -webkit-appearance:none;
    appearance:none;
    height:clamp(52px, 8.5dvh, 66px);
    border:0;
    border-radius:14px;
    background:var(--blue);
    color:#fff;
    font-family:inherit;
    font-size:22px;
    font-weight:700;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 0 var(--blue-dark);
    cursor:pointer;
    touch-action:manipulation;
    -webkit-user-select:none;
    user-select:none;
    transition:transform .05s linear, box-shadow .05s linear, background-color .1s linear;
  }
  #controls button.pressed,
  #controls button:active{
    transform:translateY(3px);
    box-shadow:0 0 0 var(--blue-dark);
    background:var(--blue-dark);
  }
  #controls button[data-act="hold"]{
    background:var(--purple);
    box-shadow:0 3px 0 var(--purple-dark);
    font-size:13px;
    letter-spacing:.5px;
  }
  #controls button[data-act="hold"].pressed,
  #controls button[data-act="hold"]:active{
    background:var(--purple-dark);
    box-shadow:none;
  }
  #controls button:focus-visible,
  #pause-btn:focus-visible,
  .pill:focus-visible{
    outline:3px solid #ffd166;
    outline-offset:2px;
  }

  /* ---------- 暫停畫面 ---------- */
  #pause-overlay{
    position:absolute;
    inset:0;
    z-index:6;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:12px;
    background:rgba(20,24,28,.32);
    border-radius:12px;
  }
  #pause-overlay.show{ display:flex; }
  .pause-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    max-width:90%;
    padding:18px 18px 16px;
    background:#fff;
    border-radius:16px;
    box-shadow:0 16px 40px rgba(0,0,0,.22);
  }
  .pause-title{ font-size:18px; font-weight:700; color:#3a3a3a; }
  .pause-actions{ display:flex; gap:10px; }
  .pill{
    -webkit-appearance:none;
    appearance:none;
    min-height:46px;
    padding:0 22px;
    border-radius:23px;
    border:1px solid #d8d0c3;
    background:#fff;
    color:#3a3a3a;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    touch-action:manipulation;
  }
  .pill.primary{
    background:var(--blue);
    border-color:var(--blue);
    color:#fff;
    box-shadow:0 3px 0 var(--blue-dark);
  }
  .pill:active{ transform:translateY(2px); }

  /* ---------- 結算報告 ---------- */
  #report{
    position:fixed;
    inset:0;
    z-index:40;
    display:none;
    background:rgba(24,28,32,.55);
    -webkit-backdrop-filter:blur(2px);
    backdrop-filter:blur(2px);
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    padding:calc(12px + var(--sat)) calc(12px + var(--sar)) calc(12px + var(--sab)) calc(12px + var(--sal));
    touch-action:pan-y;
  }
  #report.show{ display:flex; align-items:center; justify-content:center; }
  .sheet{
    width:100%;
    max-width:min(92vw, 1000px);
    max-height:100%;
    margin:0 auto;
    background:#fff;
    border-radius:16px;
    box-shadow:0 24px 60px rgba(0,0,0,.28);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    /* 報告字體跟住視窗一齊大，唔會喺 PC 變得細細粒 */
    font-size:clamp(16px, 0.5vw + 13px, 24px);
  }
  #report-body{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    padding:18px 16px 4px;
    -webkit-user-select:text;
    user-select:text;
    touch-action:pan-y;
  }
  .report-actions{
    flex:0 0 auto;
    padding:6px 16px 16px;
    background:#fff;
    box-shadow:0 -10px 18px rgba(0,0,0,.05);
  }

  /* ---------- 報告／間屋 切換 ---------- */
  .report-tabs{
    flex:0 0 auto;
    display:flex;
    gap:6px;
    padding:10px 16px 8px;
    background:#fff;
    border-bottom:1px solid #eee;
  }
  .report-tabs button{
    -webkit-appearance:none;
    appearance:none;
    flex:1 1 0;
    min-height:38px;
    border-radius:10px;
    border:1px solid #ddd5c8;
    background:#f7f3ea;
    color:#5c564d;
    font-family:inherit;
    font-size:clamp(14px, 0.35vw + 12px, 20px);
    font-weight:600;
    cursor:pointer;
    touch-action:manipulation;
  }
  .report-tabs button.active{
    background:var(--blue);
    border-color:var(--blue);
    color:#fff;
  }
  #show-report{
    display:none;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    align-items:center;
    justify-content:center;
    max-width:calc(100% - 16px);
    min-height:40px;
    padding:0 16px;
    border:0;
    border-radius:22px;
    background:#fff;
    color:#2c3e50;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    box-shadow:0 8px 22px rgba(0,0,0,.25);
    cursor:pointer;
    pointer-events:auto;
    touch-action:manipulation;
  }
  /* 睇間屋模式：拎走深色背景同白卡，淨返個棋盤 */
  #report.house-view{
    background:transparent;
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
    pointer-events:none;
  }
  #report.house-view .sheet{ display:none; }
  /* 睇間屋時，Hold/下一個同暫停都冇用，收起佢哋，原地顯示「睇返報告」 */
  body.house-view #show-report{ display:flex; }
  body.house-view #hud .slot,
  body.house-view #pause-btn{ visibility:hidden; }
  .sheet h2{
    margin:0 0 14px;
    font-size:clamp(24px, 0.8vw + 18px, 40px);
    line-height:1.3;
    color:#c0392b;
  }
  .sheet h3{
    margin:18px 0 8px;
    font-size:clamp(18px, 0.45vw + 15px, 27px);
    color:#2c3e50;
    border-left:4px solid var(--blue);
    padding-left:8px;
  }
  .stat{ margin:7px 0; line-height:1.6; }
  .price{
    font-size:clamp(28px, 1vw + 22px, 48px);
    color:#c0392b;
    font-weight:700;
    margin:10px 0;
  }
  .finding{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding:6px 0;
    border-bottom:1px dotted #ddd;
    font-size:clamp(15px, 0.4vw + 13px, 22px);
    line-height:1.45;
  }
  .finding > span:last-child{ flex:0 0 auto; white-space:nowrap; }
  .plus{ color:#27ae60; font-weight:700; }
  .minus{ color:#c0392b; font-weight:700; }
  .neutral{ color:#888; }
  #again{
    width:100%;
    min-height:clamp(54px, 4vw, 66px);
    margin-top:6px;
    border:0;
    border-radius:12px;
    background:#27ae60;
    color:#fff;
    font-family:inherit;
    font-size:clamp(18px, 0.35vw + 15px, 24px);
    font-weight:700;
    cursor:pointer;
    box-shadow:0 3px 0 #1e8449;
  }
  #again:active{ transform:translateY(3px); box-shadow:none; }
  /* 剛完場時鎖住一秒，避免玩家仍然喺下面連按時誤觸重開 */
  #again.cool{ opacity:.4; pointer-events:none; }

  /* ---------- 矮螢幕（細機）---------- */
  @media (max-height: 700px){
    #brand{ font-size:13px; }
    .slot canvas{ width:52px; height:38px; }
    .slot-label{ font-size:10.5px; max-width:96px; }
    #hint{ font-size:11px; padding-top:4px; }
    #controls button{ height:clamp(48px, 8dvh, 58px); }
  }

  /* ---------- 橫向手機 ---------- */
  @media (max-height: 560px){
    #hint{ display:none; }
  }

  @media (orientation: landscape) and (max-height: 600px){
    #app{
      width:100%;
      max-width:calc((100dvh - 8px) * 0.572 + 218px);
      display:grid;
      grid-template-columns:minmax(0,1fr) 186px;
      grid-template-rows:auto auto 1fr;
      grid-template-areas:
        "stage top"
        "stage hud"
        "stage controls";
      gap:6px 12px;
      padding:4px 10px;
    }
    #top{ grid-area:top; display:block; }
    #brand{ display:none; }
    #district{ margin-top:2px; }
    .d-name{ font-size:12px; }
    .d-meta{ white-space:normal; font-size:10px; }
    #hud{
      grid-area:hud;
      gap:6px;
      padding:0;
      margin:0;
      border-top:0;
    }
    .slot canvas{ width:48px; height:36px; }
    .slot-label{ font-size:10px; max-width:66px; }
    #pause-btn{ width:36px; height:36px; font-size:15px; border-radius:10px; }
    #stage{ grid-area:stage; height:100%; }
    #hint{ display:none; }
    #controls{
      grid-area:controls;
      display:grid;
      grid-template-columns:1fr 1fr;
      grid-auto-rows:minmax(44px, 62px);
      gap:6px;
      align-content:end;
      padding:0;
    }
    #controls button{ height:auto; border-radius:11px; font-size:19px; }
    #controls button[data-act="hold"]{ grid-column:1/-1; font-size:12px; }
  }

  /* ---------- 桌面／大螢幕：棋盤用盡高度，右邊係控制欄 ---------- */
  @media (min-width: 900px){
    #app{
      width:100%;
      max-width:980px;
      display:grid;
      grid-template-columns:minmax(0,1fr) 340px;
      grid-template-rows:auto auto auto 1fr;
      grid-template-areas:
        "stage top"
        "stage hud"
        "stage hint"
        "stage controls";
      gap:14px 30px;
      padding:16px 24px;
      align-items:start;
    }
    #top{ grid-area:top; display:flex; flex-direction:column; gap:4px; }
    #brand{ display:block; font-size:26px; }
    .d-name{ font-size:21px; }
    .d-meta{ font-size:15.5px; white-space:normal; line-height:1.4; }
    #hud{
      grid-area:hud;
      gap:18px;
      padding:6px 0;
      margin:0;
      border-top:1px solid rgba(0,0,0,.07);
      border-bottom:1px solid rgba(0,0,0,.07);
    }
    .slot canvas{ width:96px; height:72px; }
    .slot-label{ font-size:16px; max-width:210px; }
    #pause-btn{ width:58px; height:58px; font-size:24px; border-radius:14px; }
    #stage{ grid-area:stage; height:100%; align-self:stretch; }
    #hint{
      grid-area:hint;
      text-align:left;
      font-size:22px;
      line-height:1.6;
      color:#3f3a33;
      background:#fff;
      border:1px solid #e3dbcd;
      border-radius:14px;
      padding:14px 16px;
    }
    #hint .key-guide{
      display:grid;
      grid-template-columns:auto auto;
      justify-content:start;
      align-items:center;
      gap:10px 20px;
    }
    #hint .warn{
      display:block;
      font-size:18px;
      line-height:1.55;
      margin-top:12px;
      padding-top:10px;
      border-top:1px dashed #e6ded0;
    }
    #controls{
      grid-area:controls;
      align-self:stretch;
      display:grid;
      grid-template-columns:1fr 1fr;
      grid-auto-rows:clamp(58px, 8.5vh, 84px);
      gap:10px;
      padding:0 0 4px;
      align-content:end;
      min-height:220px;
    }
    #controls button{ height:auto; min-height:58px; font-size:32px; border-radius:16px; }
    #controls button[data-act="hold"]{ grid-column:1/-1; font-size:20px; }
    #show-report{ font-size:16px; min-height:46px; padding:0 22px; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="brand">🏠 砌屋仔</div>
    <div id="district"></div>
  </header>

  <div id="hud">
    <div class="slot">
      <canvas id="hold-canvas" aria-label="暫存方塊"></canvas>
      <span id="hold-text" class="slot-label">Hold：空</span>
    </div>
    <div class="slot">
      <canvas id="next-canvas" aria-label="下一個方塊"></canvas>
      <span id="next-text" class="slot-label"></span>
    </div>
    <button id="pause-btn" type="button" aria-label="暫停遊戲">⏸</button>
    <button id="show-report" type="button">📄 睇返房屋報告</button>
  </div>

  <div id="stage">
    <canvas id="game" width="288" height="504" aria-label="砌屋遊戲區"></canvas>
    <div id="pause-overlay">
      <div class="pause-card">
        <div class="pause-title">⏸ 已暫停</div>
        <div class="pause-actions">
          <button id="resume-btn" type="button" class="pill primary">繼續</button>
          <button id="restart-btn" type="button" class="pill">重新開局</button>
        </div>
      </div>
    </div>
  </div>

  <div id="hint">
    <span class="touch-only">👉 畫面拖動：左右移動、向下加速；下面按鈕一樣得</span>
    <div class="key-guide" aria-hidden="true">
      <span class="kg"><kbd>←</kbd><kbd>→</kbd> 移動</span>
      <span class="kg"><kbd>↑</kbd> 旋轉</span>
      <span class="kg"><kbd>↓</kbd> 加速</span>
      <span class="kg"><kbd>C</kbd> 暫存</span>
      <span class="kg"><kbd>Space</kbd> 暫停</span>
    </div>
    <span class="warn">方塊唔會消失，堆到頂就完場！大門只會喺開局出現一次。</span>
  </div>

  <div id="controls">
    <button data-act="left" type="button" aria-label="向左移動">◀</button>
    <button data-act="rot" type="button" aria-label="旋轉">⟳</button>
    <button data-act="down" type="button" aria-label="加速落下">▼</button>
    <button data-act="right" type="button" aria-label="向右移動">▶</button>
    <button data-act="hold" type="button" aria-label="暫存方塊">Hold</button>
  </div>
</div>

<div id="report" role="dialog" aria-modal="true" aria-label="房屋報告">
  <div class="sheet">
    <div class="report-tabs" role="tablist" aria-label="切換報告或間屋">
      <button id="tab-house" type="button" role="tab" aria-selected="false">🏠 我間屋</button>
      <button id="tab-report" type="button" role="tab" aria-selected="true" class="active">📄 房屋報告</button>
    </div>
    <div id="report-body"></div>
    <div class="report-actions">
      <button id="again" type="button">再玩一次</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  const COLS = 8, ROWS = 14, DROP_MS = 800;
  const MAX_CELL_NARROW = 46, MAX_CELL_WIDE = 72;

  function maxCellSize(){
    return window.innerWidth >= 900 ? MAX_CELL_WIDE : MAX_CELL_NARROW;
  }

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stageEl = document.getElementById('stage');
  const pauseOverlay = document.getElementById('pause-overlay');
  const pauseBtn = document.getElementById('pause-btn');
  const reportEl = document.getElementById('report');
  const reportBody = document.getElementById('report-body');
  const againBtn = document.getElementById('again');
  const tabHouse = document.getElementById('tab-house');
  const tabReport = document.getElementById('tab-report');

  function fitBoard(){
    const rect = stageEl.getBoundingClientRect();
    if(!rect.width || !rect.height) return;

    const cell = Math.floor(Math.min(rect.width / COLS, rect.height / ROWS));
    CELL = Math.max(8, Math.min(maxCellSize(), cell));
    DPR = Math.min(window.devicePixelRatio || 1, 3);

    const w = COLS * CELL, h = ROWS * CELL;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';

    const pw = Math.round(w * DPR), ph = Math.round(h * DPR);
    if(canvas.width !== pw || canvas.height !== ph){
      canvas.width = pw;
      canvas.height = ph;
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    draw();

    if(next) updateNextLabel();
    if(holdPiece !== undefined) updateHoldLabel();
  }

  /* ---------- 小預覽圖 ---------- */
  function prepPreview(cvs){
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const w = cvs.clientWidth || 58;
    const h = cvs.clientHeight || 42;
    const pw = Math.round(w * dpr), ph = Math.round(h * dpr);
    if(cvs.width !== pw || cvs.height !== ph){
      cvs.width = pw;
      cvs.height = ph;
    }
    const c = cvs.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    return { c:c, w:w, h:h };
  }

  function drawPreview(id, piece){
    const cvs = document.getElementById(id);
    const p = prepPreview(cvs);
    if(!piece) return;

    const sh = piece.shape, rows = sh.length, cols = sh[0].length;
    const cell = Math.max(6, Math.floor(Math.min((p.w - 10) / cols, (p.h - 8) / rows)));
    const ox = (p.w - cols * cell) / 2;
    const oy = (p.h - rows * cell) / 2;

    for(let r = 0; r < rows; r++){
      for(let c = 0; c < cols; c++){
        if(!sh[r][c]) continue;
        p.c.fillStyle = '#1a1a1a';
        p.c.fillRect(ox + c * cell, oy + r * cell, cell, cell);
        p.c.fillStyle = piece.room.color;
        p.c.fillRect(ox + c * cell + 1.5, oy + r * cell + 1.5, cell - 3, cell - 3);
      }
    }
  }

  /* ---------- 遊戲流程 ---------- */
  function resetCurrentPosition(){
    current.x = Math.floor((buildCols - current.shape[0].length) / 2);
    current.y = 0;
  }

  function spawn(){
    current = next || makePiece();
    resetCurrentPosition();
    next = makePiece();
    canHold = true;
    updateNextLabel();
    draw();
    if(collide(current.x, current.y, current.shape)) endGame();
  }

  function holdPieceFunc(){
    if(gameOver || paused || !current || !canHold) return;
    if(holdPiece === null){
      holdPiece = { shape: current.shape, room: current.room };
      current = next;
      next = makePiece();
      resetCurrentPosition();
      canHold = false;
      updateHoldLabel();
      updateNextLabel();
      draw();
      if(collide(current.x, current.y, current.shape)) endGame();
    } else {
      const temp = { shape: holdPiece.shape, room: holdPiece.room };
      holdPiece = { shape: current.shape, room: current.room };
      current = temp;
      resetCurrentPosition();
      canHold = false;
      updateHoldLabel();
      draw();
      if(collide(current.x, current.y, current.shape)) endGame();
    }
  }

  function drawCell(px, py, room, alpha){
    const wall = Math.max(2, Math.round(CELL * 0.08));
    ctx.globalAlpha = (alpha === undefined ? 1 : alpha);

    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(px, py, CELL, CELL);
    ctx.fillStyle = room.color;
    ctx.fillRect(px + wall, py + wall, CELL - wall * 2, CELL - wall * 2);

    if(CELL >= 26){
      ctx.fillStyle = '#fff';
      ctx.font = 'bold ' + Math.round(CELL * 0.5) + 'px "PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(room.short, px + CELL / 2, py + CELL / 2 + 1);
    }
    ctx.globalAlpha = 1;
  }

  function draw(){
    if(!board) return;

    const W = COLS * CELL, H = ROWS * CELL;
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    ctx.fillStyle = '#dcdcdc';
    if(buildCols < COLS) ctx.fillRect(buildCols * CELL, 0, (COLS - buildCols) * CELL, H);
    if(buildRows < ROWS) ctx.fillRect(0, buildRows * CELL, W, (ROWS - buildRows) * CELL);
    ctx.strokeStyle = '#c4c4c4';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i = -ROWS; i < COLS + ROWS; i++){
      ctx.moveTo(i * CELL + 0.5, 0);
      ctx.lineTo(i * CELL - ROWS * CELL + 0.5, H);
    }
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = '#8a8a8a';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.strokeRect(1, 1, buildCols * CELL - 2, buildRows * CELL - 2);
    ctx.restore();

    for(let r = 0; r < ROWS; r++){
      for(let c = 0; c < COLS; c++){
        const cell = board[r][c];
        if(cell) drawCell(c * CELL, r * CELL, cell);
      }
    }

    if(current){
      // 落點預覽
      let gy = current.y;
      while(!collide(current.x, gy + 1, current.shape)) gy++;
      if(gy !== current.y){
        const sh0 = current.shape;
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.strokeStyle = current.room.color;
        ctx.lineWidth = Math.max(1.5, CELL * 0.05);
        ctx.setLineDash([Math.max(3, CELL * 0.15), Math.max(2, CELL * 0.1)]);
        for(let r = 0; r < sh0.length; r++){
          for(let c = 0; c < sh0[r].length; c++){
            if(!sh0[r][c]) continue;
            ctx.strokeRect((current.x + c) * CELL + 2, (gy + r) * CELL + 2, CELL - 4, CELL - 4);
          }
        }
        ctx.restore();
      }

      const sh = current.shape;
      for(let r = 0; r < sh.length; r++){
        for(let c = 0; c < sh[r].length; c++){
          if(sh[r][c]) drawCell((current.x + c) * CELL, (current.y + r) * CELL, current.room);
        }
      }
    }
  }
